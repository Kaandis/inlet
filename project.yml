name: Inlet
options:
  bundleIdPrefix: app.inlet
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  HarborKit:
    url: https://github.com/Kaandis/harbor-kit
    from: 0.2.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Inlet:
    type: application
    platform: macOS
    sources:
      - path: Inlet
    dependencies:
      - package: HarborKit
    info:
      path: Inlet/Resources/Info.plist
      properties:
        CFBundleDisplayName: Inlet
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSAppleEventsUsageDescription: Inlet talks to Music and Spotify to show and control what’s playing.
        NSCalendarsFullAccessUsageDescription: Inlet reads your calendar to show today’s events on the island.
        NSCalendarsUsageDescription: Inlet reads your calendar to show today’s events on the island.
        NSBluetoothAlwaysUsageDescription: Inlet watches Bluetooth to let you know when devices like AirPods connect.
    entitlements:
      path: Inlet/Resources/Inlet.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.inlet.Inlet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Release builds shouldn't let debuggers attach.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
